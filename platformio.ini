; PlatformIO configuration — Cardio Drum Trainer (ESP32)
; Rope-pull cardio drum: AS5600 encoder + PWM magnetic brake, BLE Nordic UART.
; Reuses the Ferra PCB / brake / AS5600 hardware. No WiFi.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Flashing via a programmer: if it enumerates on a fixed COM port, uncomment and set it.
; upload_port = COM5

lib_deps =
    robtillaart/AS5600@^0.6.0

build_flags =
    -D CORE_DEBUG_LEVEL=0
